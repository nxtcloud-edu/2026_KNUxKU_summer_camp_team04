[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning
    # 서드파티(sqlmodel/pydantic)에서 올라오는 것까지 실패시킬 필요는 없다.
    # 우리가 잡으려는 건 datetime.utcnow() 같은 우리 코드의 deprecation이다.
    default::DeprecationWarning:sqlmodel.*
    default::DeprecationWarning:pydantic.*
    default::DeprecationWarning:sqlalchemy.*
