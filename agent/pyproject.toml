[project]
name = "tutor-agent"
version = "0.1.0"
description = "CodeTrace/TUTORY 학습 튜터 멀티에이전트 파이프라인 (초안)"
requires-python = ">=3.12"
dependencies = [
    # "로컬 에이전트" 기본값 = Anthropic 다이렉트 API (AWS 불필요) 이므로
    # anthropic extra를 기본 의존성에 포함한다.
    "strands-agents[anthropic]>=1.0.0",
    "strands-agents-tools>=0.8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # agent를 별도 프로세스(HTTP 서비스)로 띄우기 위한 것 (src/tutor_agent/service.py).
    # backend와 같은 venv를 쓰지 않으므로 여기 버전은 backend와 달라도 된다 —
    # 오히려 그게 이 구조의 목적이다 (strands가 끌어오는 starlette가 backend의
    # fastapi와 충돌해서 한 프로세스에 넣을 수 없다. service.py 상단 참고).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # backend가 이 서비스를 부를 때 쓰는 클라이언트(src/tutor_agent/http_client.py)와
    # fastapi.testclient가 함께 쓴다.
    "httpx>=0.27",
]

[project.optional-dependencies]
# 다른 프로바이더로 바꾸기로 정해지면 .env의 MODEL_PROVIDER를 바꾸고 아래 extra를 같이 설치하세요.
# (bedrock은 strands-agents 기본 설치에 이미 포함되어 있어 별도 extra가 없습니다.)
#   pip install -e ".[openai]"      # MODEL_PROVIDER=openai 용
#   pip install -e ".[litellm]"     # MODEL_PROVIDER=litellm 용 (Ollama 등 완전 로컬 모델 포함)
openai = ["strands-agents[openai]"]
litellm = ["strands-agents[litellm]"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
