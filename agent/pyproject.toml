[project]
name = "tutor-agent"
version = "0.1.0"
description = "CodeTrace/TUTORY 학습 튜터 멀티에이전트 파이프라인 (초안)"
requires-python = ">=3.12"
dependencies = [
    # "로컬 에이전트" 기본값 = Anthropic 다이렉트 API (AWS 불필요) 이므로
    # anthropic extra를 기본 의존성에 포함한다.
    "strands-agents[anthropic]>=1.0.0",
    "strands-agents-tools>=0.8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 다른 프로바이더로 바꾸기로 정해지면 .env의 MODEL_PROVIDER를 바꾸고 아래 extra를 같이 설치하세요.
# (bedrock은 strands-agents 기본 설치에 이미 포함되어 있어 별도 extra가 없습니다.)
#   pip install -e ".[openai]"      # MODEL_PROVIDER=openai 용
#   pip install -e ".[litellm]"     # MODEL_PROVIDER=litellm 용 (Ollama 등 완전 로컬 모델 포함)
openai = ["strands-agents[openai]"]
litellm = ["strands-agents[litellm]"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
